name: macOS validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Compile the public Liquid Glass API into artifacts; retain macOS 14 runtime
# support via availability checks. The macOS 15 runner defaults to Xcode 16.4.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  hid-installer-package:
    # Build the deliverable with the stable 27 SDK and exercise real native
    # glass code. The other job retains the macOS 15 / Xcode 26.3 fallback gate.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify current-generation SDK
        run: |
          xcodebuild -version
          swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "$sdk_version" == 27.* ]]
      - name: Build App and package complete drag-install DMG without installation
        run: |
          bash scripts/build-app.sh
          export BRIDGE_RELEASE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          bash scripts/package-single-app.sh
          bash scripts/package-app-dmg.sh
      - name: Verify downloadable packages and record their exact source
        run: |
          (cd build/download && shasum -a 256 -c ./*.sha256)
          bridge_check="$RUNNER_TEMP/complete-package-check"
          ditto -x -k build/download/*-app-macos-arm64.zip "$bridge_check"
          codesign --verify --deep --strict "$bridge_check/WindowsMacBridge.app"
          "$bridge_check/WindowsMacBridge.app/Contents/MacOS/WindowsMacBridge" --self-check
          python3 - "$GITHUB_SHA" "$bridge_check/WindowsMacBridge.app" <<'PY'
          import hashlib, json, plistlib, sys
          from pathlib import Path
          app = Path(sys.argv[2])
          info = plistlib.loads((app/'Contents/Info.plist').read_bytes())
          if info.get('WMBGitRevision') != sys.argv[1] or info.get('WMBSourceState') != 'clean':
              raise SystemExit('Package must contain the exact clean checkout revision')
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in Path('build/download').iterdir() if p.suffix in ('.zip', '.dmg')}
          report = {'commit': sys.argv[1], 'source_state': info['WMBSourceState'],
                    'version': info['CFBundleShortVersionString'], 'build': info['CFBundleVersion'],
                    'architecture': 'arm64', 'minimum_macos': info['LSMinimumSystemVersion'],
                    'signing': 'ad-hoc', 'notarized': False, 'sha256': files}
          Path('build/download/WindowsMacBridge-build-info.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Verify native glass layouts and UI release on macOS 27
        run: |
          bridge_app="$(cat build/APP_PATH.txt)"
          "$bridge_app/Contents/MacOS/WindowsMacBridge" --render-feature-checks "$RUNNER_TEMP/native-glass-layouts"
          "$bridge_app/Contents/MacOS/WindowsMacBridge" --ui-resource-check "$RUNNER_TEMP/native-glass-resources.json"
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsMacBridge-complete-app
          path: |
            build/download/*.zip
            build/download/*.zip.sha256
            build/download/*.dmg
            build/download/*.dmg.sha256
            build/download/*-build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsMacBridge-native-glass-feature-layouts
          path: |
            ${{ runner.temp }}/native-glass-layouts/*.png
            ${{ runner.temp }}/native-glass-resources.json
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift and SDK versions
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          swift --version
      - name: Unit and AppKit tests with isolated memory regression
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
        # test.sh runs the process-wide footprint check separately; both must pass.
        # Failing test lines become annotations, readable without log access.
        run: |
          set -o pipefail
          bash scripts/test.sh 2>&1 | tee -a "$RUNNER_TEMP/swift-tests.log"
      - name: Full optimized regressions with isolated memory check
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
        # Failing test lines become annotations, readable without log access.
        run: |
          set -o pipefail
          bash scripts/test.sh -c release 2>&1 | tee -a "$RUNNER_TEMP/swift-tests.log"
      - name: Annotate failing Swift tests
        if: failure()
        run: grep -E '✘|error:|Fatal error' "$RUNNER_TEMP/swift-tests.log" | head -40 | sed 's/^/::error::/' || true
      - name: Installer, rollback and ZIP version regressions
        run: python3 -m unittest discover -s Tests/InstallerTests -v
      - name: Resource measurement regressions
        run: python3 -m unittest discover -s Tests/MonitoringTests -v
      - name: Build and verify development app
        run: bash scripts/build-app.sh
      - name: Render generated feature layouts without input services
        run: |
          bridge_app="$(cat build/APP_PATH.txt)"
          "$bridge_app/Contents/MacOS/WindowsMacBridge" --render-feature-checks "$RUNNER_TEMP/feature-visual-checks"
      - name: Verify generated UI ownership after repeated close
        run: |
          bridge_app="$(cat build/APP_PATH.txt)"
          "$bridge_app/Contents/MacOS/WindowsMacBridge" --ui-resource-check "$RUNNER_TEMP/ui-resource-check.json"
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsMacBridge-generated-feature-layouts
          path: |
            ${{ runner.temp }}/feature-visual-checks/*.png
            ${{ runner.temp }}/ui-resource-check.json
      - name: Build GitHub ZIP source without .git
        run: |
          bridge_zip_source="$(mktemp -d)"
          git archive HEAD | tar -x -C "$bridge_zip_source"
          bash "$bridge_zip_source/scripts/build-app.sh"
      - name: Test process crash diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          reports = (Path.home() / 'Library/Logs/DiagnosticReports').glob('WindowsMacBridgePackageTests*')
          for report in sorted(reports, key=lambda p: p.stat().st_mtime, reverse=True)[:2]:
              print(report.name)
              print(report.read_text(errors='replace')[:100000])
          PY
