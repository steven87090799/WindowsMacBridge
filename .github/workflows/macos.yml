name: macOS validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hid-installer-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned VirtualHID client and run offline tests
        run: bash scripts/build-hid-helper.sh
      - name: Build App and package integrated installer without installation
        run: |
          bash scripts/build-app.sh
          bash scripts/package-hid-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsMacBridge-HID-installer-development
          path: |
            build/download/*.zip
            build/download/*.zip.sha256
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit and in-process AppKit tests
        run: bash scripts/test.sh
      - name: Optimized native notification and screenshot regressions
        run: bash scripts/test.sh -c release --filter 'nativeServiceNotificationRegistrationRetainsBridgedKeys|backgroundImagePreparationPublishesOnlyImmutableImageData'
      - name: Resource measurement regressions
        run: python3 -m unittest discover -s Tests/MonitoringTests -v
      - name: Build and verify development app
        run: bash scripts/build-app.sh
      - name: Package app
        run: bash scripts/package-app-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsMacBridge-development
          path: |
            build/download/*.dmg
            build/download/*.dmg.sha256
