name: macOS validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Compile the public Liquid Glass API into artifacts; retain macOS 14 runtime
# support via availability checks. The macOS 15 runner defaults to Xcode 16.4.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  hid-installer-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build App and package complete drag-install DMG without installation
        run: |
          bash scripts/build-app.sh
          export BRIDGE_RELEASE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)-preview.1"
          bash scripts/package-single-app.sh
          bash scripts/package-app-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsMacBridge-HID-installer-development
          path: |
            build/download/*.zip
            build/download/*.zip.sha256
            build/download/*.dmg
            build/download/*.dmg.sha256
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift and SDK versions
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          swift --version
      - name: Unit and AppKit tests with isolated memory regression
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
        # test.sh runs the process-wide footprint check separately; both must pass.
        # Failing test lines become annotations, readable without log access.
        run: |
          set -o pipefail
          bash scripts/test.sh 2>&1 | tee -a "$RUNNER_TEMP/swift-tests.log"
      - name: Full optimized regressions with isolated memory check
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
        # Failing test lines become annotations, readable without log access.
        run: |
          set -o pipefail
          bash scripts/test.sh -c release 2>&1 | tee -a "$RUNNER_TEMP/swift-tests.log"
      - name: Annotate failing Swift tests
        if: failure()
        run: grep -E '✘|error:|Fatal error' "$RUNNER_TEMP/swift-tests.log" | head -40 | sed 's/^/::error::/' || true
      - name: Installer, rollback and ZIP version regressions
        run: python3 -m unittest discover -s Tests/InstallerTests -v
      - name: Resource measurement regressions
        run: python3 -m unittest discover -s Tests/MonitoringTests -v
      - name: Build and verify development app
        run: bash scripts/build-app.sh
      - name: Render generated feature layouts without input services
        run: |
          bridge_app="$(cat build/APP_PATH.txt)"
          "$bridge_app/Contents/MacOS/WindowsMacBridge" --render-feature-checks "$RUNNER_TEMP/feature-visual-checks"
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsMacBridge-generated-feature-layouts
          path: ${{ runner.temp }}/feature-visual-checks/*.png
      - name: Build GitHub ZIP source without .git
        run: |
          bridge_zip_source="$(mktemp -d)"
          git archive HEAD | tar -x -C "$bridge_zip_source"
          bash "$bridge_zip_source/scripts/build-app.sh"
      - name: Test process crash diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          reports = (Path.home() / 'Library/Logs/DiagnosticReports').glob('WindowsMacBridgePackageTests*')
          for report in sorted(reports, key=lambda p: p.stat().st_mtime, reverse=True)[:2]:
              print(report.name)
              print(report.read_text(errors='replace')[:100000])
          PY
